name: nyc_taxi
version: "1.0.0"
profile: nyc_taxi

model-paths: ["models"]
test-paths: ["tests"]

models:
  nyc_taxi:
    # Databricks only: the TLC times are timestamp_ntz, which Delta needs switched on per table.
    +tblproperties:
      delta.feature.timestampNtz: supported
    staging:
      +materialized: table
      +schema: staging
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
