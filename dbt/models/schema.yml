version: 2

models:
  - name: silver_green_trips
    description: One row per valid trip.
    columns:
      - name: trip_id
        tests: [unique, not_null]
      - name: pickup_ts
        tests: [not_null]
      - name: total_amount
        tests: [not_null]

  - name: silver_green_trips_rejected
    description: Rows that failed a rule, with the reason.
    columns:
      - name: reject_reason
        tests:
          - not_null
          - accepted_values:
              values: [NULL_PICKUP, NULL_DROPOFF, DROPOFF_BEFORE_PICKUP, NULL_AMOUNT, DUPLICATE]

  - name: gold_daily_revenue
    description: One row per day, with gross, adjustments and net revenue.
    columns:
      - name: service_date
        tests: [unique, not_null]
      - name: net_revenue
        tests: [not_null]
